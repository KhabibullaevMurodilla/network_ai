name: Build live-capture helper

# Packages agent/live_bridge.py into one downloadable program per OS (no Python
# needed on the user's machine). Run it by hand (Actions -> Run workflow) to get
# the files as workflow artifacts, or push a tag like v1.0.0 to also attach them
# to a GitHub Release.
#
# The Linux build was tested on a real capture; the Windows and macOS builds are
# produced by this workflow and have NOT been run by the author yet.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: network-ai-live-bridge-windows.exe
            built: network-ai-live-bridge.exe
          - os: ubuntu-latest
            asset: network-ai-live-bridge-linux
            built: network-ai-live-bridge
          - os: macos-latest
            asset: network-ai-live-bridge-macos
            built: network-ai-live-bridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        working-directory: agent
        shell: bash
        run: |
          pip install dpkt pyinstaller
          pyinstaller --onefile --name network-ai-live-bridge --clean live_bridge.py
          mkdir -p ../out
          cp "dist/${{ matrix.built }}" "../out/${{ matrix.asset }}"
      - name: Smoke test (replay a test capture, read flows over HTTP)
        shell: bash
        run: |
          ./out/${{ matrix.asset }} --replay frontend/tests/local/sample.pcap --port 8791 --token ci &
          sleep 4
          curl -sf -H "Authorization: Bearer ci" "http://127.0.0.1:8791/flows?since=0" | tee flows.json
          python -c "import json;d=json.load(open('flows.json'));assert len(d['flows'])==5, d"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
